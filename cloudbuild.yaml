# cloudbuild.yaml
# Builds and deploys the BACKEND (FastAPI/gunicorn) service to Cloud Run.
# Run from the repo root.
#
# Prerequisites — create these secrets first (reuse the values from your
# local .env file / Supabase dashboard):
#   printf '%s' "<DATABASE_URL>"      | gcloud secrets create DATABASE_URL      --data-file=-
#   printf '%s' "<SUPABASE_URL>"      | gcloud secrets create SUPABASE_URL      --data-file=-
#   printf '%s' "<SUPABASE_KEY>"      | gcloud secrets create SUPABASE_KEY      --data-file=-
#   printf '%s' "<SUPABASE_USERNAME>" | gcloud secrets create SUPABASE_USERNAME --data-file=-
#   printf '%s' "<SUPABASE_PASSWORD>" | gcloud secrets create SUPABASE_PASSWORD --data-file=-
#   printf '%s' "<SUPERVITY_API_KEY>" | gcloud secrets create SUPERVITY_API_KEY --data-file=-
#   Grant the Cloud Build/Cloud Run service account "Secret Manager Secret Accessor" on each.
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=asia-southeast1,_SERVICE=autopilot-backend,_FRONTEND_URL=https://autopilot-frontend-xxxx.run.app \
#     .
#
# Note: AUTH_BYPASS is set to "true" below to match the current deployed
# config (dev-user auto-auth, no real access control — see conversation
# history). Flip to unset/"false" once real Keycloak auth is configured.

substitutions:
  _REGION: asia-southeast1
  _SERVICE: autopilot-backend
  _FRONTEND_URL: ""

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t=gcr.io/$PROJECT_ID/${_SERVICE}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/${_SERVICE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}
      - --region=${_REGION}
      - --platform=managed
      - --set-env-vars=APP_ENV=production,AUTH_BYPASS=true,FRONTEND_URL=${_FRONTEND_URL},SUPERVITY_BASE_URL=https://auto-workflow-api.supervity.ai/api/v1
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_KEY=SUPABASE_KEY:latest,SUPABASE_USERNAME=SUPABASE_USERNAME:latest,SUPABASE_PASSWORD=SUPABASE_PASSWORD:latest,SUPERVITY_API_KEY=SUPERVITY_API_KEY:latest
      - --allow-unauthenticated

images:
  - gcr.io/$PROJECT_ID/${_SERVICE}
